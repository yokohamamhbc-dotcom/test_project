name: Loop Engineering Check
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify application contract and evidence ledger
        run: |
          set -euo pipefail
          test -f index.html
          test -f style.css
          test -f app.js
          test -f loop/experiments.json
          test -f loop/business.json
          test -f loop/events.json
          grep -q 'Loop Engineering Lab' index.html
          grep -q 'style.css' index.html
          grep -q 'app.js' index.html
          node --check app.js
          node - <<'NODE'
          const business=require('./loop/business.json');
          const events=require('./loop/events.json');
          const requiredEvents=["VISIT","ACTIVATION","TRIAL_STARTED","PURCHASE","RETENTION"];
          if(events.schemaVersion!==1 || events.status!=="NOT_CONNECTED" || events.provider!=="NONE" || !Array.isArray(events.events) || requiredEvents.some(n=>!events.events.some(e=>e.name===n))) process.exit(1);
          if(business.schemaVersion!==1 || !business.northStar || business.northStar.metric!=="revenue" || !Array.isArray(business.funnel) || business.funnel.length<1) process.exit(1);
          const x=require('./loop/experiments.json');
          if(x.schemaVersion!==1 || !Array.isArray(x.experiments) || x.experiments.length<1) process.exit(1);
          const ids=new Set();
          const decisions=new Set(["PENDING","PASS","FAIL"]); const evidenceStatuses=new Set(["PENDING","PASS","FAIL","READY"]);
          for(const e of x.experiments){
            if(!e.id||ids.has(e.id)||!e.hypothesis||!e.change||!decisions.has(e.decision)||!e.next) process.exit(1); if(e.id==="EXP-006"||e.id==="EXP-007"||e.id==="EXP-009"||e.id==="EXP-010"||e.id==="EXP-011"||e.id==="EXP-012"||e.id==="EXP-013"||e.id==="EXP-014"){const v=e.evidence;if(!v||!v.ci||!v.preview||!v.production||!v.http||!evidenceStatuses.has(v.ci.status)||!evidenceStatuses.has(v.preview.status)||!evidenceStatuses.has(v.production.status)||!evidenceStatuses.has(v.http.status)) process.exit(1);} else if(!Array.isArray(e.evidence)||e.evidence.length<1) process.exit(1);
            ids.add(e.id);
          }
          console.log("experiments="+x.experiments.length);
          NODE
          cat > loop-report.json <<'JSON'
          {
            "schemaVersion": 1,
            "generatedBy": "loop-check",
            "contract": "PASS",
            "ledger": "PASS"
          }
          JSON
          echo "LOOP_CHECK=PASS"
          echo "EVIDENCE_LEDGER=PASS"
      - name: Publish machine-readable loop report
        uses: actions/upload-artifact@v4
        with:
          name: loop-report
          path: loop-report.json
