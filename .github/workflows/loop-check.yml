name: Loop Engineering Check
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        run: |
          set -euo pipefail
          for f in index.html style.css app.js loop/experiments.json loop/business.json loop/events.json scripts/analytics-probe.mjs scripts/revenue-loop-sentinel.mjs scripts/production-smoke.mjs api/checkout.js; do
            test -f "$f"
            echo "FILE_OK=$f"
          done
          grep -q 'Loop Engineering Lab' index.html
          grep -q 'style.css' index.html
          grep -q 'app.js' index.html
          echo "HTML_REFERENCES=PASS"

      - name: Verify app.js syntax
        run: node --check app.js

      - name: Verify analytics probe syntax
        run: node --check scripts/analytics-probe.mjs

      - name: Verify autonomous sentinel syntax
        run: |
          node --check scripts/revenue-loop-sentinel.mjs
          node --check scripts/production-smoke.mjs

      - name: Verify checkout API syntax
        run: node --check api/checkout.js

      - name: Verify control plane audit syntax
        run: node --check scripts/control-plane-audit.cjs

      - name: Verify JSON and experiment contracts
        run: |
          set -euo pipefail
          node - <<'NODE'
          const business=require('./loop/business.json');
          const events=require('./loop/events.json');
          const requiredEvents=["VISIT","ACTIVATION","TRIAL_STARTED","PURCHASE","RETENTION"];
          if(events.schemaVersion!==1 || events.status!=="NOT_CONNECTED" || events.provider!=="NONE" || !Array.isArray(events.events) || requiredEvents.some(n=>!events.events.some(e=>e.name===n))) throw new Error("EVENT_CONTRACT_FAIL");
          if(business.schemaVersion!==1 || !business.northStar || business.northStar.metric!=="revenue" || !Array.isArray(business.funnel) || business.funnel.length<1) throw new Error("BUSINESS_CONTRACT_FAIL");
          const x=require('./loop/experiments.json');
          if(x.schemaVersion!==1 || !Array.isArray(x.experiments) || x.experiments.length<1) throw new Error("LEDGER_CONTRACT_FAIL");
          const ids=new Set();
          const decisions=new Set(["PENDING","PASS","FAIL"]);
          const evidenceStatuses=new Set(["PENDING","PASS","FAIL","READY"]);
          for(const e of x.experiments){
            if(!e.id||ids.has(e.id)||!e.hypothesis||!e.change||!decisions.has(e.decision)||!e.next) throw new Error("EXPERIMENT_HEADER_FAIL:"+e.id);
            if(e.id==="EXP-006"||e.id==="EXP-007"||e.id==="EXP-009"||e.id==="EXP-010"||e.id==="EXP-011"||e.id==="EXP-012"||e.id==="EXP-013"||e.id==="EXP-014"||e.id==="EXP-015"||e.id==="EXP-016"||e.id==="EXP-017"||e.id==="EXP-018"||e.id==="EXP-019"||e.id==="EXP-020"||e.id==="EXP-021"||e.id==="EXP-023"||e.id==="EXP-024"||e.id==="EXP-025"||e.id==="EXP-026"||e.id==="EXP-027"||e.id==="EXP-028"||e.id==="EXP-029"){
              const v=e.evidence;
              if(!v||!v.ci||!v.preview||!v.production||!v.http||!evidenceStatuses.has(v.ci.status)||!evidenceStatuses.has(v.preview.status)||!evidenceStatuses.has(v.production.status)||!evidenceStatuses.has(v.http.status)) throw new Error("STRUCTURED_EVIDENCE_FAIL:"+e.id);
            } else if(!Array.isArray(e.evidence)||e.evidence.length<1) throw new Error("LEGACY_EVIDENCE_FAIL:"+e.id);
            ids.add(e.id);
          }
          console.log("experiments="+x.experiments.length);
          console.log("JSON_CONTRACT=PASS");
          NODE

      - name: Test checkout contract without payment credentials
        run: |
          node - <<'NODE'
          const handler=require("./api/checkout.js").default;
          const req={url:"/api/checkout?offer=audit&mode=status"};
          const res={
            statusCode:200,
            body:null,
            status(n){this.statusCode=n;return this;},
            json(v){this.body=v;}
          };
          delete process.env.CHECKOUT_URL;
          handler(req,res);
          if(res.statusCode!==200 || res.body?.configured!==false) process.exit(1);
          console.log("CHECKOUT_CONTRACT=PASS");
          NODE

      - name: Run control plane audit
        run: node scripts/control-plane-audit.cjs

      - name: Run autonomous revenue-loop sentinel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CHECKOUT_URL: ${{ secrets.CHECKOUT_URL }}
        run: |
          mkdir -p probe-output
          node scripts/revenue-loop-sentinel.mjs | tee probe-output/revenue-loop-sentinel.json

      - name: Run production smoke test when configured
        env:
          PRODUCTION_URL: https://test-project-yokohamamhbc-9529.vercel.app
        run: |
          mkdir -p probe-output
          node scripts/production-smoke.mjs | tee probe-output/production-smoke.json

      - name: Probe Vercel Web Analytics API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p probe-output
          node scripts/analytics-probe.mjs | tee probe-output/analytics.json
      - name: Generate machine-readable loop report
        run: |
          cat > loop-report.json <<'JSON'
          {
            "schemaVersion": 1,
            "generatedBy": "loop-check",
            "contract": "PASS",
            "ledger": "PASS"
          }
          JSON
          echo "LOOP_CHECK=PASS"
          echo "EVIDENCE_LEDGER=PASS"
      - name: Publish machine-readable loop report
        uses: actions/upload-artifact@v4
        with:
          name: loop-report
          path: loop-report.json
      - name: Publish analytics probe result
        uses: actions/upload-artifact@v4
        with:
          name: analytics-probe
          path: probe-output/analytics.json
      - name: Publish autonomous sentinel result
        uses: actions/upload-artifact@v4
        with:
          name: revenue-loop-sentinel
          path: probe-output/revenue-loop-sentinel.json
      - name: Publish production smoke result
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke
          path: probe-output/production-smoke.json
